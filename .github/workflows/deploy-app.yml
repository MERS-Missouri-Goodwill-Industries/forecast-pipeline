name: Validate Databricks App

# This workflow validates. It does NOT deploy.
#
# The app `sales-forecast-workbook` is bound to this repository (branch main, SNAPSHOT
# mode) in the Databricks Apps UI, so it redeploys itself from the resolved commit --
# no CLI step, no workspace sync, no secrets needed here.
#
# The deploy job that used to live here targeted an app name that does not exist
# (`fy2027-sales-planning`) and ran `databricks apps create`, so running it would have
# stood up a SECOND app on MEDIUM compute -- roughly $200-350/month billed in parallel
# with the real one -- and switched that one off git-source mode onto workspace files.
# It was removed rather than repointed.
#
# One app, one source directory: the Streamlit app at the repo root. A React/Express
# prototype used to live in apps/sales-planning-node and was a selectable deploy target
# here; it was retired because it shipped 525 npm packages -- and five open advisories,
# two of them high on the Databricks SQL driver's transitive `thrift` -- for a UI the
# Python app already covers. Git history has it if it is ever wanted back.

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "app.yaml"
      - "databricks_io.py"
      - "forecast_engine.py"
      - "workbook.py"
      - "seed_data.json"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/deploy-app.yml"
  pull_request:
    paths:
      - "app.py"
      - "app.yaml"
      - "databricks_io.py"
      - "forecast_engine.py"
      - "workbook.py"
      - "seed_data.json"
      - "requirements.txt"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: databricks-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The deploy-config checks reproduce the "No command to run and no Python file found"
  # failure locally, so a broken app.yaml fails CI instead of the platform.
  validate-python:
    name: Validate Python app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Acceptance + deployment config checks
        run: python tests/test_acceptance.py
