name: Validate and deploy Databricks App

# One app, one source directory: the Streamlit app at the repo root. A React/Express
# prototype used to live in apps/sales-planning-node and was a selectable deploy target
# here; it was retired because it shipped 525 npm packages -- and five open advisories,
# two of them high on the Databricks SQL driver's transitive `thrift` -- for a UI the
# Python app already covers. Git history has it if it is ever wanted back.

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "app.yaml"
      - "databricks_io.py"
      - "forecast_engine.py"
      - "workbook.py"
      - "seed_data.json"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/deploy-app.yml"
  pull_request:
    paths:
      - "app.py"
      - "app.yaml"
      - "databricks_io.py"
      - "forecast_engine.py"
      - "workbook.py"
      - "seed_data.json"
      - "requirements.txt"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: databricks-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The deploy-config checks reproduce the "No command to run and no Python file found"
  # failure locally, so a broken app.yaml fails CI instead of the platform.
  validate-python:
    name: Validate Python app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Acceptance + deployment config checks
        run: python tests/test_acceptance.py

  deploy:
    name: Deploy to Databricks
    needs: [validate-python]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: databricks
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      APP_NAME: fy2027-sales-planning
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Sync source to workspace
        run: |
          TARGET="/Workspace/Shared/${APP_NAME}"
          databricks sync . "$TARGET" --full

      - name: Create app if absent
        run: databricks apps create "$APP_NAME" || echo "app already exists"

      - name: Deploy
        run: |
          databricks apps deploy "$APP_NAME" \
            --source-code-path "/Workspace/Shared/${APP_NAME}"

      - name: Report
        run: |
          echo "Deployed the Python app from the repo root"
          echo "Bind the SQL warehouse as an App Resource in the Apps UI if not already done."
